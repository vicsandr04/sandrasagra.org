<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SANDRASAGRA.ORG</title>


<link rel="stylesheet" href="style.css">


<script src="https://d3js.org/d3.v7.min.js"></script>


</head>


<body>

<a
    id="lineage-login"
    href="https://lineage.sandrasagra.org"
    target="_blank"
    rel="noopener noreferrer"
>
    Login to <span>lineage.sandrasagra.org</span>
</a>


<!-- ======================================
     BRAND INTRO
====================================== -->


<header id="brand">


    <h1>
        SANDRASAGRA.ORG
    </h1>


    <h2>
        This is where we relate
    </h2>


</header>



<!-- ======================================
     SEARCH
====================================== -->


<div id="search-panel">


    <input

        id="relation-input"

        name="lineage-person-search"

        type="search"

        role="searchbox"

        aria-label="Relate yourself"

        aria-autocomplete="none"

        autocomplete="off"

        autocapitalize="none"

        autocorrect="off"

        spellcheck="false"

        enterkeyhint="search"

        data-form-type="other"

        data-lpignore="true"

        data-1p-ignore

        data-bwignore

        placeholder="Relate yourself"

    >


</div>



<!-- ======================================
     FAMILY UNIVERSE
====================================== -->


<div id="universe">

</div>



<script src="graph.js"></script>


</body>

</html>
